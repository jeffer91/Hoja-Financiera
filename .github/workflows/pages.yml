name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository audit tests
        run: node --test tests/audit.test.cjs
      - name: Verify manual teacher form before deployment
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const app=fs.readFileSync('app.js','utf8');if(!html.includes('teacherLastNames') || !html.includes('teacherFirstNames') || /id=\"lookupBtn\"|id=\"manualTeacherBtn\"/.test(html) || app.includes('patrociniosGenerados'))process.exit(1)"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
