name: Pruebas reales de navegador

on:
  push:
    branches: ["main"]
    paths:
      - "app.js"
      - "api-config.js"
      - "index.html"
      - "styles.css"
      - "administrador/**"
      - "tests/browser-smoke.cjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

concurrency:
  group: browser-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium para la prueba
        run: |
          mkdir -p /tmp/hf-playwright
          cd /tmp/hf-playwright
          printf '{"name":"hf-smoke-tests","private":true}' > package.json
          npm install --no-audit --no-fund playwright@1.57.0
          npx playwright install chromium
      - name: Probar formulario y PDF multipágina
        run: NODE_PATH=/tmp/hf-playwright/node_modules node --test tests/browser-smoke.cjs
      - name: Comprobar estado público de Render y sus períodos
        run: |
          node --input-type=module <<'NODE'
          const base='https://hoja-financiera-api.onrender.com';
          for(const path of ['/api/health','/api/periods']) {
            try {
              const response=await fetch(base+path,{signal:AbortSignal.timeout(55000)});
              const info=await response.json();
              console.log(path+' HTTP '+response.status);
              if(path==='/api/health') {
                console.log('API lista='+Boolean(info.ok)+'; Base de datos='+Boolean(info.databaseReady)+'; Storage='+Boolean(info.storageReady));
                if(!info.ok)console.log('::warning::El backend necesita revisión de Firebase o Storage.');
              } else {
                for(const id of ['2026-05_2026-11','2026-11_2027-05']) {
                  const found=Boolean(info.periodos?.[id]);
                  console.log('Período '+id+': '+(found?'disponible':'NO DISPONIBLE'));
                  if(!found)console.log('::warning::Falta período '+id+' en la API desplegada.');
                }
              }
            } catch(error) {
              console.log('::warning::No fue posible comprobar '+path+': '+error.message);
            }
          }
          NODE
